# BookHive local development services
# Start:  docker compose -f infra/docker-compose.yml up -d
# Stop:   docker compose -f infra/docker-compose.yml down
# The passwords below are for local development only, never for production.

name: bookhive

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookhive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookhive}
      POSTGRES_USER: ${POSTGRES_USER:-bookhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookhive}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: bookhive-redis
    # Append-only file so cached data survives a container restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: bookhive-mailpit
    ports:
      - "1025:1025" # SMTP: the backend sends emails here
      - "8025:8025" # Web UI: open http://localhost:8025 to read them
    restart: unless-stopped

  # Optional: only starts with --profile app. Day to day you run the backend from the IDE
  # (./gradlew bootRun); this is for running the whole stack in containers.
  #   docker compose -f infra/docker-compose.yml --profile app up -d --build
  backend:
    profiles: ["app"]
    build: ../backend
    image: bookhive-backend:local
    container_name: bookhive-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Inside the compose network the database host is the service name, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/bookhive
      DB_USERNAME: ${POSTGRES_USER:-bookhive}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookhive}
      MAIL_HOST: mailpit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional, like the backend: http://localhost:3000
  frontend:
    profiles: ["app"]
    build:
      context: ../frontend
      args:
        # The browser calls the backend through the published port on localhost
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    image: bookhive-frontend:local
    container_name: bookhive-frontend
    environment:
      # Server-side rendering calls the backend inside the compose network
      API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine "localhost" resolves to IPv6 ::1, but Next.js listens on IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/en"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
