name: Backend CI

# Runs on every PR and on pushes to main, but only when backend code (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# A new push to the same PR cancels the older, now pointless run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle and its downloaded dependencies between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # check = spotlessCheck (formatting) + all tests (unit, ArchUnit, Testcontainers).
      # GitHub's Ubuntu runners have Docker, so Testcontainers works as it does locally.
      - name: Check formatting and run tests
        run: ./gradlew check

      - name: Build jar
        run: ./gradlew bootJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7
