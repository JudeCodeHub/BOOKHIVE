# Local development. Defaults match infra/docker-compose.yml; override them in backend/.env.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookhive}
    username: ${DB_USERNAME:bookhive}
    password: ${DB_PASSWORD:bookhive}

bookhive:
  auth:
    refresh-cookie-secure: false
  # Local-only admin so you can log in to Swagger and the staff/admin pages right away.
  # Never used outside the dev profile; prod sets BOOTSTRAP_ADMIN_* as real secrets.
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@bookhive.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:honey-hive-dev-2026}
    full-name: Dev Admin
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    allow-generated-keys: true
  security:
    public-api-docs: true
  # Dev-only key for encrypting NIC numbers (your local database only). Prod: FIELD_ENCRYPTION_KEY
  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY:Fk1J0KkGb3NewDt9Z7xvq5AzEF6owlpWzU/T68VeMms=}

logging:
  level:
    lk.bookhive: debug
