# Automated tests. The database comes from Testcontainers (see TestcontainersConfiguration).

bookhive:
  # High limits so tests that log in many times aren't blocked; RateLimitTest sets its own
  rate-limit:
    rules:
      login: { capacity: 100000 }
      register: { capacity: 100000 }
      forgot-password: { capacity: 100000 }
      reset-password: { capacity: 100000 }
      accept-invite: { capacity: 100000 }
      verify-email: { capacity: 100000 }
      contact: { capacity: 100000 }
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    allow-generated-keys: true
  # No S3 server in tests: files go to a folder under build/
  storage:
    type: local
    local-dir: build/test-uploads
  # Tests don't call Cloudflare
  turnstile:
    enabled: false
  crypto:
    # Test-only key (32 zero bytes)
    field-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

logging:
  level:
    lk.bookhive: debug
