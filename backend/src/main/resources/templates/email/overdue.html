<!DOCTYPE html>
<!-- OVERDUE. Values: name, books [{title, dueDate, daysLate}], link (My loans) -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(~{::title}, ~{::main})}">
<head>
  <title th:text="#{email.overdue.subject(${books.size()})}">BookHive</title>
</head>
<body>
<main>
  <p th:text="#{email.hello(${name})}">Hello</p>
  <p th:text="#{email.overdue.intro}">…</p>
  <ul style="padding-left:20px;">
    <li th:each="book : ${books}" style="margin-bottom:6px;"><strong th:text="${book.title}">Title</strong><br>
      <span th:text="#{email.overdue.item(${#temporals.format(book.dueDate, 'EEEE d MMMM yyyy')}, ${book.daysLate})}">Due, late</span></li>
  </ul>
  <p th:text="#{email.overdue.note}">…</p>
  <p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;background:#0f3d3e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;" th:text="#{email.openLoans}">Open</a></p>
  <p th:text="#{email.signoff}">BookHive</p>
</main>
</body>
</html>
