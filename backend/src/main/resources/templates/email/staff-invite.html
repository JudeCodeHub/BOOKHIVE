<!DOCTYPE html>
<!-- STAFF_INVITE. Values: name, role (LIBRARIAN or ADMIN), link -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(~{::title}, ~{::main})}">
<head>
  <title th:text="#{email.staff-invite.subject}">BookHive</title>
</head>
<body>
<main>
  <p th:text="#{email.hello(${name})}">Hello</p>
  <p th:text="#{email.staff-invite.intro(${#messages.msg('email.role.' + role)})}">…</p>
  <p th:text="#{email.staff-invite.note}">…</p>
  <p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;background:#0f3d3e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;" th:text="#{email.staff-invite.action}">Open</a></p>
  <p th:text="#{email.signoff}">BookHive</p>
</main>
</body>
</html>
