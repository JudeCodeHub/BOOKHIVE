# SMS wording (step 311). Short: every 160 characters (70 in Sinhala/Tamil) is one paid part.
# {0} count, {1} first title, {2} date. Use ’ not ' for apostrophes.
sms.due-soon=BookHive: {0,choice,1#“{1}” is|1<{0} books are} due on {2}. Renew online or return at the desk.
sms.overdue=BookHive: {0,choice,1#“{1}” was|1<{0} books were} due on {2}. Please return or renew to stop the daily fine.
sms.hold-ready=BookHive: “{0}” is ready for you at the desk. Collect it by {1}.
