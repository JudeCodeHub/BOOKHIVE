email.event-reminder.note=வாசலில் உங்கள் நுழைவுச் சீட்டை (QR குறியீடு) காட்டவும். வர முடியாவிட்டால், காத்திருப்புப் பட்டியலில் உள்ள ஒருவருக்கு இடம் கிடைக்க நிகழ்வுப் பக்கத்தில் ரத்துசெய்யவும்.
