email.email-verification.subject=உங்கள் மின்னஞ்சல் முகவரியை உறுதிப்படுத்தவும்
email.email-verification.intro=BookHive இல் இணைந்ததற்கு நன்றி. இது உங்கள் மின்னஞ்சல் முகவரி என்பதை உறுதிப்படுத்தவும்.
email.email-verification.action=எனது மின்னஞ்சலை உறுதிப்படுத்து
email.email-verification.note=இணைப்பு 24 மணி நேரம் செல்லுபடியாகும். நீங்கள் பதிவு செய்யவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கவும்.

email.password-reset.subject=உங்கள் BookHive கடவுச்சொல்லை மீட்டமைக்கவும்
email.password-reset.intro=உங்கள் கடவுச்சொல்லை மீட்டமைக்கும் கோரிக்கை எங்களுக்குக் கிடைத்தது.
email.password-reset.action=புதிய கடவுச்சொல்லைத் தேர்ந்தெடு
email.password-reset.note=இணைப்பு 1 மணி நேரம் செல்லுபடியாகும். நீங்கள் இதைக் கேட்கவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கவும்: உங்கள் கடவுச்சொல் மாறாது.

email.password-changed.subject=உங்கள் BookHive கடவுச்சொல் மாற்றப்பட்டது
email.password-changed.intro=உங்கள் கடவுச்சொல் இப்போது மாற்றப்பட்டது.
email.password-changed.note=இது நீங்கள் இல்லையென்றால், உடனே உங்கள் கடவுச்சொல்லை மீட்டமைத்து நூலகத்திற்குத் தெரிவிக்கவும்.
