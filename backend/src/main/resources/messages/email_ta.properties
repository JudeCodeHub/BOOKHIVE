email.checkout-receipt.subject=உங்கள் ரசீது: {0,choice,1#1 புத்தகம்|1<{0} புத்தகங்கள்} இரவல் பெறப்பட்டது
email.checkout-receipt.intro={0} அன்று நீங்கள் இரவல் பெற்ற புத்தகங்கள் இதோ.
email.checkout-receipt.note=வேறொருவர் முன்பதிவு செய்யாவிட்டால், எனது இரவல்கள் பகுதியிலிருந்து புத்தகங்களை இணையத்தில் புதுப்பிக்கலாம். தாமதமான திருப்பலுக்கு நாளொன்றுக்குச் சிறிய அபராதம் விதிக்கப்படும்.

email.due-soon.subject=நினைவூட்டல்: {0,choice,1#ஒரு புத்தகம்|1<{0} புத்தகங்கள்} விரைவில் திருப்ப வேண்டும்
email.due-soon.intro=இந்தப் புத்தகங்களை விரைவில் திருப்ப வேண்டும்:
email.due-soon.note=வேறொருவர் முன்பதிவு செய்யாவிட்டால், அவற்றை இணையத்தில் புதுப்பிக்கலாம்.

email.overdue.subject=தாமதம்: உங்கள் {0,choice,1#புத்தகத்தைத்|1<{0} புத்தகங்களைத்} திருப்பி அளிக்கவும்
email.overdue.intro=இந்தப் புத்தகங்கள் திருப்ப வேண்டிய தேதியைக் கடந்துவிட்டன:
