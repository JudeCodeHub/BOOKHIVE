email.event-place-confirmed.intro=நல்ல செய்தி: “{0}” இல் ஒரு இடம் காலியானது, அது உங்களுக்கு.
email.event-place-confirmed.note=வாசலில் உங்கள் நுழைவுச் சீட்டை (QR குறியீடு) காட்டவும்; அது நிகழ்வுப் பக்கத்தில் உள்ளது. வர முடியாவிட்டால், வேறொருவருக்கு இடம் கிடைக்க அங்கே ரத்துசெய்யவும்.

email.event-cancelled.subject=ரத்துசெய்யப்பட்டது: {0}
