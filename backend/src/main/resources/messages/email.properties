email.membership-approved.intro=Good news: your {0} membership is approved.
email.membership-approved.action=Open my library card
email.membership-approved.note=Show your card at the desk to borrow books.

email.membership-rejected.subject=About your membership application
email.membership-rejected.intro=We couldn’t approve your membership application.
email.membership-rejected.action=Update my application
email.membership-rejected.note=You can correct this and apply again. If you have questions, please contact the library.

email.membership-expiring.subject=Your membership ends on {0}
