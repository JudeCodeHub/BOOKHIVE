email.email-verification.subject=Confirm your email address
email.email-verification.intro=Thanks for joining BookHive. Please confirm that this is your email address.
email.email-verification.action=Confirm my email
email.email-verification.note=The link works for 24 hours. If you didn’t sign up, you can ignore this email.

email.password-reset.subject=Reset your BookHive password
email.password-reset.intro=We received a request to reset your password.
email.password-reset.action=Choose a new password
email.password-reset.note=The link works for 1 hour. If you didn’t ask for this, ignore this email: your password stays the same.

email.password-changed.subject=Your BookHive password was changed
email.password-changed.intro=Your password was just changed.
email.password-changed.note=If this wasn’t you, reset your password now and let the library know.
email.password-changed.action=Reset my password

email.staff-invite.subject=You’re invited to the BookHive staff team
email.staff-invite.intro=You’ve been invited to join BookHive as {0}.
email.staff-invite.action=Set my password
email.role.LIBRARIAN=a librarian
email.role.ADMIN=an administrator
