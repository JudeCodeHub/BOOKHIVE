# Shared settings for every profile.
# Profile files (application-dev.yml, -test.yml, -prod.yml) override these.

spring:
  application:
    name: bookhive
  profiles:
    # Used when no profile is set (e.g. ./gradlew bootRun). Prod sets SPRING_PROFILES_ACTIVE=prod.
    default: dev
  config:
    # Optional local secrets file (backend/.env, git-ignored). See .env.example.
    import: optional:file:.env[.properties]

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep the DB session open while rendering the response (avoids hidden lazy-loading queries).
    open-in-view: false
    properties:
      hibernate:
        # Timestamps are written and read as UTC, whatever the server's time zone is.
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  # Redis: rate limits now, caching later. Default: Redis from infra/docker-compose.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Outgoing email. Default: Mailpit from infra/docker-compose.yml (inbox: http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  # Uploads (membership documents): photos/scans up to 5 MB. Type checks: checklist step 127
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mvc:
    # Spring's built-in errors use RFC 7807 ProblemDetail, like ours.
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only these two; everything else (env, beans, heapdump...) would leak internals.
        include: health,info
  health:
    # Rate limiting lets requests through when Redis is down, so a Redis outage must not mark
    # the whole app unhealthy (which would make the load balancer stop sending traffic)
    redis:
      enabled: false
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /readiness for Docker / AWS health checks
      probes:
        enabled: true

logging:
  pattern:
    # Adds [requestId] to every console log line (see RequestIdFilter).
    correlation: "[%X{requestId:-}] "

bookhive:
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    staff-invite-ttl: 72h
    # Lock an account for 15 minutes after 5 wrong passwords in a row (AUTH-6)
    max-failed-logins: 5
    lockout-duration: 15m
    # Refresh cookie only over HTTPS. Turned off in dev, which runs on plain http://localhost
    refresh-cookie-secure: true
  mail:
    from: ${MAIL_FROM:BookHive <no-reply@bookhive.lk>}
    # Website address used in email links
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:bookhive}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # PEM keys (see .env.example). Required in prod; dev/test generate a temporary pair.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:bookhive-1}
    allow-generated-keys: false
  # The very first admin, created at startup only while no admin exists (step 105)
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  # Uploaded files. Local folder for now; MinIO / S3 in checklist step 126
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
  # Per-IP limits on endpoints attackers like to hammer (PRD §6 Security)
  rate-limit:
    enabled: true
    rules:
      login: { path: /api/v1/auth/login, capacity: 10, period: 1m }
      register: { path: /api/v1/auth/register, capacity: 5, period: 1h }
      forgot-password: { path: /api/v1/auth/forgot-password, capacity: 5, period: 1h }
      reset-password: { path: /api/v1/auth/reset-password, capacity: 10, period: 1h }
      accept-invite: { path: /api/v1/auth/accept-invite, capacity: 10, period: 1h }
      verify-email: { path: /api/v1/auth/verify-email, capacity: 20, period: 1h }
  security:
    # Swagger UI and /v3/api-docs reachable without login (dev only)
    public-api-docs: false
