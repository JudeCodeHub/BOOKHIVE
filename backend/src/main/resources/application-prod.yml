# Production. No defaults on purpose: the app fails to start if a secret is missing.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # AWS SES (or any SMTP server) over TLS
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

bookhive:
  mail:
    frontend-url: ${FRONTEND_URL}
  # AWS S3 itself: no endpoint override, credentials from the server's IAM role.
  # The bucket is created by infrastructure with "Block all public access" on.
  storage:
    s3:
      endpoint: ""
      region: ${S3_REGION}
      bucket: ${S3_BUCKET}
      access-key: ""
      secret-key: ""
      path-style: false
      create-bucket: false
  # Encrypts NIC numbers in the database. 32 random bytes, Base64. Losing it makes stored NICs
  # unreadable, so keep a copy in AWS Secrets Manager.
  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY}
  cors:
    # Comma-separated, e.g. https://bookhive.lk,https://www.bookhive.lk
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  # Behind the AWS load balancer: take the client IP from X-Forwarded-For (rate limits, logs)
  forward-headers-strategy: native

# API docs are for development only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  # One JSON object per line (Elastic Common Schema), easy to search in CloudWatch.
  # MDC values such as requestId are included automatically.
  structured:
    format:
      console: ecs
  level:
    root: info
