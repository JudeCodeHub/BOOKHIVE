# Production. No defaults on purpose: the app fails to start if a secret is missing.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # AWS SES (or any SMTP server) over TLS
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

bookhive:
  mail:
    frontend-url: ${FRONTEND_URL}
  cors:
    # Comma-separated, e.g. https://bookhive.lk,https://www.bookhive.lk
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API docs are for development only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  # One JSON object per line (Elastic Common Schema), easy to search in CloudWatch.
  # MDC values such as requestId are included automatically.
  structured:
    format:
      console: ecs
  level:
    root: info
