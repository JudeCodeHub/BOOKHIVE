# pnpm only runs a package's install script if it's allowed here (protects against
# malicious install scripts). These all ship prebuilt binaries, so their scripts aren't needed.
allowBuilds:
  sharp: false
  unrs-resolver: false
  "@swc/core": false # used by next-intl's optional message extractor
  "@parcel/watcher": false # used by next-intl's optional message extractor
